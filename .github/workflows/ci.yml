name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check the website publishing credential
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.hugging_face }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          credential = os.environ.get('HF_TOKEN', '').strip()
          if not credential:
              print('::error::The repository Actions secret hugging_face is unavailable.')
              sys.exit(1)
          request = urllib.request.Request(
              'https://huggingface.co/api/whoami-v2',
              headers={'Authorization': 'Bearer ' + credential},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  identity = json.load(response)
          except urllib.error.HTTPError as error:
              print(f'::error::Hugging Face rejected the saved publishing credential (HTTP {error.code}). Check the hugging_face repository secret.')
              sys.exit(1)
          if identity.get('name', '').casefold() != 'Tejascodex001'.casefold():
              print('::error::The saved credential must belong to the Tejascodex001 account that owns the Space.')
              sys.exit(1)
          if identity.get('auth', {}).get('accessToken', {}).get('role') == 'read':
              print('::error::The saved credential is read-only. Publishing needs write access to Tejascodex001/flame-visualizer.')
              sys.exit(1)
          print('Publishing credential authenticated for Tejascodex001. Space write access will be checked during upload.')
          PYTHON
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Engine unit tests
        run: cargo test -p flame-engine
      - name: Build WebAssembly engine
        run: |
          cargo install wasm-pack --version 0.15.1 --locked
          cd web && npm ci && npm run wasm
      - name: Fetch the published model (pinned commit)
        run: |
          base=$(grep VITE_MODEL_BASE web/.env.production | cut -d= -f2)
          mkdir -p hf_export
          for f in config.json flame_tokenizer.json model.safetensors metrics.jsonl; do curl -sfL -o hf_export/$f "${base}$f"; done
      - name: WebAssembly engine reproduces FLAME's greedy output
        run: node tools/wasm_smoke.mjs hf_export
      - name: Typecheck, lint, unit tests, build
        working-directory: web
        run: npm run check && npm run lint && npm test && npm run build
      - name: End-to-end + accessibility (axe, WCAG 2.1 AA)
        working-directory: web
        run: npx playwright install --with-deps chromium && npx playwright test

      - name: Install the website publisher
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: python3 -m pip install --quiet 'huggingface_hub==2.4.0'
      - name: Publish the tested website to Hugging Face
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.hugging_face }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::Add a repository secret named hugging_face with write access to Tejascodex001/flame-visualizer, then run this workflow manually from main."
            exit 1
          fi
          space_stage_dir=$(mktemp -d)
          cp -R web/dist/. "$space_stage_dir/"
          cp hf/SPACE_README.md "$space_stage_dir/README.md"
          hf upload Tejascodex001/flame-visualizer "$space_stage_dir" . --repo-type space --delete 'assets/*' --commit-message "Update FLAME visualizer branding"
          rm -rf "$space_stage_dir"
